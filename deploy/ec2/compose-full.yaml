name: quantscope

services:
  scanner:
    build:
      context: ../..
      dockerfile: deploy/ec2/Dockerfile
    image: quantscope:${QUANTSCOPE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ALGORITHM_EXECUTION_ENABLED: "true"
      SITES_SYNC_ENABLED: "false"
      SCANNER_SINGLE_TICK: "true"
      SCANNER_CONCURRENCY: "8"
      TZ: Europe/Istanbul
    secrets:
      - scanner_env
    volumes:
      - type: bind
        source: ${QUANTSCOPE_DATA_DIR:-/opt/quantscope/data}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.wrangler:size=128m,mode=1777
      - /app/node_modules/.mf:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8791/api/scanner"]
      interval: 30s
      timeout: 6s
      retries: 10
      start_period: 90s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  web:
    build:
      context: ../..
      dockerfile: deploy/ec2/Dockerfile
    image: quantscope:${QUANTSCOPE_IMAGE_TAG:-local}
    restart: unless-stopped
    entrypoint: ["dumb-init", "--", "/usr/local/bin/quantscope-web"]
    environment:
      TZ: Europe/Istanbul
      PORT: 8791
      PERSIST_DIR: /data
      ALGORITHM_EXECUTION_ENABLED: "true"
      SCANNER_STATUS_UPSTREAM_URL: http://scanner:8791/api/scanner
      # Run BIST paper trading against EC2's persistent local D1 so scoring and
      # portfolio migrations always match the deployed application version.
      BIST_PAPER_STATUS_UPSTREAM_URL: ""
      XDG_CONFIG_HOME: /tmp/quantscope/config
      WRANGLER_LOG_PATH: /tmp/quantscope/wrangler-logs
      MINIFLARE_REGISTRY_PATH: /tmp/quantscope/miniflare-registry
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    depends_on:
      scanner:
        condition: service_healthy
    ports: ["80:8791"]
    secrets:
      - scanner_env
    volumes:
      - type: bind
        source: ${QUANTSCOPE_WEB_DATA_DIR:-/opt/quantscope/web-data}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.wrangler:size=128m,mode=1777
      - /app/node_modules/.mf:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8791/"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

secrets:
  scanner_env:
    file: ${QUANTSCOPE_SECRET_FILE:-/opt/quantscope/secrets/scanner.env}
