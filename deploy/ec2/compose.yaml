name: quantscope

services:
  scanner:
    build:
      context: ../..
      dockerfile: deploy/ec2/Dockerfile
    image: quantscope-scanner:${QUANTSCOPE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ALGORITHM_EXECUTION_ENABLED: "true"
      SITES_SYNC_ENABLED: "false"
      SCANNER_SINGLE_TICK: "true"
      SCANNER_CONCURRENCY: "8"
      TZ: Europe/Istanbul
    secrets:
      - scanner_env
    volumes:
      - type: bind
        source: ${QUANTSCOPE_DATA_DIR:-/opt/quantscope/data}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.wrangler:size=128m,mode=1777
      - /app/node_modules/.mf:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8791/api/scanner"]
      interval: 30s
      timeout: 6s
      retries: 10
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

secrets:
  scanner_env:
    file: ${QUANTSCOPE_SECRET_FILE:-/opt/quantscope/secrets/scanner.env}
